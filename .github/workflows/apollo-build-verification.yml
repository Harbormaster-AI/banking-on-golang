name: Apollo Build Verification

on:

  workflow_call:

    inputs:

      runner:
        description: GitHub runner
        required: false
        default: self-hosted
        type: string

      resultUrl:
        description: URL to post certification progress
        required: false
        default: "http://localhost:3000"
        type: string

      actionToCall:
        description: action to call when posting to URL
        required: true
        default: "updateSystemVerificationProgress"
        type: string

      branch:
        description: Branch to checkout
        required: true
        default: ""
        type: string

      certificationIdentifier:
        description: Certification Identifier
        required: true
        type: string

      appName:
        description: Application Name
        required: true
        type: string

      languageVersion:
        description: Node.js version
        required: false
        default: "22.22.3"
        type: string

      languageName:
        description: Core language of the system
        required: false
        default: "TypeScript"
        type: string


env:

  RESULT_URL: ${{ inputs.resultUrl }}
  ACTION_TO_CALL: ${{ inputs.actionToCall }}
  CERTIFICATION_IDENTIFIER: ${{ inputs.certificationIdentifier }}
  APP_NAME: ${{ inputs.appName }}


jobs:

  build-verification:

    runs-on: ${{ inputs.runner }}

    steps:

      ###############################################################################
      # Checkout Source
      ###############################################################################

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}


      ###############################################################################
      # Load Reporting Library
      ###############################################################################

      - name: Make report.sh executable
        run: chmod +x .github/actions/common/report.sh


      ###############################################################################
      # Verify Checkout
      ###############################################################################

      - name: Verify Checkout

        shell: bash

        run: |

          source .github/actions/common/report.sh

          if [ -d ".git" ]; then

              post_pass \
                  "BUILD" \
                  "CHECKOUT_SOURCE" \
                  0 \
                  "Repository checked out successfully."

          else

              post_fail \
                  "BUILD" \
                  "CHECKOUT_SOURCE" \
                  0 \
                  "Repository checkout failed."

              post_terminate_build

          fi


      ###############################################################################
      # Determine Node.js Version
      ###############################################################################

      - name: Determine Node.js Version

        shell: bash

        run: |

          NODE_VERSION="${{ inputs.languageVersion }}"

          if [ -z "$NODE_VERSION" ]; then
              NODE_VERSION="22.22.3"
          fi

          echo "NODE_VERSION=${NODE_VERSION}" >> "$GITHUB_ENV"

          echo "Using Node.js ${NODE_VERSION}"


      ###############################################################################
      # Setup Node.js
      ###############################################################################

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:
          node-version: ${{ env.NODE_VERSION }}


      ###############################################################################
      # Verify Node.js and npm
      ###############################################################################

      - name: Verify Node.js Version

        shell: bash

        run: |

          node --version
          npm --version


      ###############################################################################
      # Expected Files
      ###############################################################################

      - name: Expected Files

        shell: bash

        run: |

          source .github/actions/common/report.sh

          SCORE=0

          ###########################################################################
          # package.json
          ###########################################################################

          if [ -f "package.json" ]; then

              SCORE=$((SCORE + 2))

              post_pass \
                  "BUILD" \
                  "PACKAGE_JSON" \
                  2 \
                  "package.json located."

          else

              post_fail \
                  "BUILD" \
                  "PACKAGE_JSON" \
                  0 \
                  "package.json not found."

          fi


          ###########################################################################
          # package-lock.json
          ###########################################################################

          if [ -f "package-lock.json" ]; then

              SCORE=$((SCORE + 2))

              post_pass \
                  "BUILD" \
                  "PACKAGE_LOCK" \
                  2 \
                  "package-lock.json located."

          else

              post_fail \
                  "BUILD" \
                  "PACKAGE_LOCK" \
                  0 \
                  "package-lock.json not found."

          fi


          ###########################################################################
          # tsconfig.json
          ###########################################################################

          if [ -f "tsconfig.json" ]; then

              SCORE=$((SCORE + 1))

              post_pass \
                  "BUILD" \
                  "TSCONFIG" \
                  1 \
                  "tsconfig.json located."

          else

              post_fail \
                  "BUILD" \
                  "TSCONFIG" \
                  0 \
                  "tsconfig.json not found."

          fi


          ###########################################################################
          # server.ts
          ###########################################################################

          if [ -f "src/server.ts" ]; then

              SCORE=$((SCORE + 2))

              post_pass \
                  "BUILD" \
                  "SERVER_TS" \
                  2 \
                  "Apollo server bootstrap source located."

          else

              post_fail \
                  "BUILD" \
                  "SERVER_TS" \
                  0 \
                  "src/server.ts not found."

          fi


          ###########################################################################
          # schema.ts
          ###########################################################################

          if [ -f "src/graphql/schema.ts" ]; then

              SCORE=$((SCORE + 1))

              post_pass \
                  "BUILD" \
                  "GRAPHQL_SCHEMA" \
                  1 \
                  "GraphQL schema located."

          else

              post_fail \
                  "BUILD" \
                  "GRAPHQL_SCHEMA" \
                  0 \
                  "src/graphql/schema.ts not found."

          fi


          ###########################################################################
          # resolvers.ts
          ###########################################################################

          if [ -f "src/graphql/resolvers.ts" ]; then

              SCORE=$((SCORE + 1))

              post_pass \
                  "BUILD" \
                  "GRAPHQL_RESOLVERS" \
                  1 \
                  "GraphQL resolvers located."

          else

              post_fail \
                  "BUILD" \
                  "GRAPHQL_RESOLVERS" \
                  0 \
                  "src/graphql/resolvers.ts not found."

          fi


          ###########################################################################
          # backend/api.ts
          ###########################################################################

          if [ -f "src/backend/api.ts" ]; then

              SCORE=$((SCORE + 1))

              post_pass \
                  "BUILD" \
                  "BACKEND_API" \
                  1 \
                  "Backend API contract located."

          else

              post_fail \
                  "BUILD" \
                  "BACKEND_API" \
                  0 \
                  "src/backend/api.ts not found."

          fi


          ###########################################################################
          # Summary
          ###########################################################################

          post_result \
              "BUILD" \
              "EXPECTED_FILES" \
              "PASSED" \
              0 \
              "Expected files validation complete (${SCORE}/10)."


      ###############################################################################
      # Directory Structure
      ###############################################################################

      - name: Directory Structure

        shell: bash

        run: |

          source .github/actions/common/report.sh

          SCORE=0


          ###########################################################################
          # src
          ###########################################################################

          if [ -d "src" ]; then

              SCORE=$((SCORE + 3))

              post_pass \
                  "BUILD" \
                  "SRC_DIRECTORY" \
                  3 \
                  "src directory exists."

          else

              post_fail \
                  "BUILD" \
                  "SRC_DIRECTORY" \
                  0 \
                  "Missing mandatory src directory."

          fi


          ###########################################################################
          # graphql
          ###########################################################################

          if [ -d "src/graphql" ]; then

              SCORE=$((SCORE + 4))

              post_pass \
                  "BUILD" \
                  "GRAPHQL_DIRECTORY" \
                  4 \
                  "src/graphql directory exists."

          else

              post_fail \
                  "BUILD" \
                  "GRAPHQL_DIRECTORY" \
                  0 \
                  "Missing mandatory src/graphql directory."

          fi


          ###########################################################################
          # backend
          ###########################################################################

          if [ -d "src/backend" ]; then

              SCORE=$((SCORE + 3))

              post_pass \
                  "BUILD" \
                  "BACKEND_DIRECTORY" \
                  3 \
                  "src/backend directory exists."

          else

              post_fail \
                  "BUILD" \
                  "BACKEND_DIRECTORY" \
                  0 \
                  "Missing mandatory src/backend directory."

          fi


          ###########################################################################
          # Summary
          ###########################################################################

          if [ "$SCORE" -ge 8 ]; then
              STATUS="PASSED"
          else
              STATUS="FAILED"
          fi

          post_result \
              "BUILD" \
              "DIRECTORY_STRUCTURE" \
              "${STATUS}" \
              0 \
              "Directory structure validation complete (${SCORE}/10)."

      ###############################################################################
      # Dependency Validation
      ###############################################################################

      - name: Dependency Validation

        shell: bash

        run: |

          source .github/actions/common/report.sh


          ###########################################################################
          # package-lock.json
          ###########################################################################

          if [ ! -f "package-lock.json" ]; then

              post_fail \
                  "BUILD" \
                  "PACKAGE_LOCK" \
                  0 \
                  "package-lock.json not found."

              post_terminate_build

          fi


          ###########################################################################
          # Install dependencies exactly as locked
          ###########################################################################

          if npm ci > dependency-validation.log 2>&1; then

              post_pass \
                  "BUILD" \
                  "NPM_DEPENDENCY_INSTALL" \
                  10 \
                  "npm dependency installation completed successfully."

          else

              cat dependency-validation.log

              MESSAGE=$(tail -20 dependency-validation.log | tr '\n' ' ')

              post_fail \
                  "BUILD" \
                  "NPM_DEPENDENCY_INSTALL" \
                  0 \
                  "${MESSAGE}"

              post_terminate_build

          fi

      ###############################################################################
      # TypeScript / Apollo Configuration Validation
      ###############################################################################

      - name: TypeScript Configuration Validation

        shell: bash

        run: |

          source .github/actions/common/report.sh

          SCORE=0


          ###########################################################################
          # Validate TypeScript configuration
          ###########################################################################

          if npx tsc --showConfig > typescript-config.log 2>&1; then

              SCORE=$((SCORE + 10))

              post_pass \
                  "BUILD" \
                  "TYPESCRIPT_CONFIGURATION" \
                  10 \
                  "TypeScript configuration is valid."

          else

              MESSAGE=$(tail -20 typescript-config.log | tr '\n' ' ')

              post_fail \
                  "BUILD" \
                  "TYPESCRIPT_CONFIGURATION" \
                  0 \
                  "${MESSAGE}"

              post_terminate_build

          fi



      ###############################################################################
      # Execute TypeScript Production Build
      ###############################################################################

      - name: Execute Build

        shell: bash

        run: |

          source .github/actions/common/report.sh


          ###########################################################################
          # TypeScript Production Build
          ###########################################################################

          if npm run build > build.log 2>&1; then

              cat build.log

              post_pass \
                  "BUILD" \
                  "TYPESCRIPT_BUILD" \
                  40 \
                  "TypeScript production build completed successfully."

          else

              cat build.log

              MESSAGE=$(tail -30 build.log | tr '\n' ' ')

              post_fail \
                  "BUILD" \
                  "TYPESCRIPT_BUILD" \
                  0 \
                  "${MESSAGE}"

              post_terminate_build

          fi


      ###############################################################################
      # Determine Build Output
      ###############################################################################

      - name: Determine Build Output

        shell: bash

        run: |

          source .github/actions/common/report.sh

          BUILD_DIRECTORY="dist"

          if [ ! -d "${BUILD_DIRECTORY}" ]; then

              post_fail \
                  "BUILD" \
                  "BUILD_OUTPUT" \
                  0 \
                  "Unable to locate TypeScript build output."

              post_terminate_build

          fi

          echo "BUILD_DIRECTORY=${BUILD_DIRECTORY}" >> "$GITHUB_ENV"

          echo "Apollo build directory: ${BUILD_DIRECTORY}"


      ###############################################################################
      # Validate Build Artifact
      ###############################################################################

      - name: Validate Build Artifact

        shell: bash

        run: |

          source .github/actions/common/report.sh


          ###########################################################################
          # Output Directory
          ###########################################################################

          if [ -d "${BUILD_DIRECTORY}" ]; then

              echo "Contents of ${BUILD_DIRECTORY}:"

              find "${BUILD_DIRECTORY}" -maxdepth 4 -type f | head -100

          else

              post_fail \
                  "BUILD" \
                  "BUILD_ARTIFACT" \
                  0 \
                  "Apollo build directory does not exist."

              post_terminate_build

          fi


          ###########################################################################
          # server.js
          ###########################################################################

          SERVER_FILE=$(find "${BUILD_DIRECTORY}" \
              -type f \
              -name "server.js" \
              | head -1)

          if [ -z "$SERVER_FILE" ]; then

              post_fail \
                  "BUILD" \
                  "BUILD_ARTIFACT" \
                  0 \
                  "No compiled server.js found in Apollo build output."

              post_terminate_build

          fi


          ###########################################################################
          # JavaScript
          ###########################################################################

          JS_FILE=$(find "${BUILD_DIRECTORY}" \
              -type f \
              -name "*.js" \
              | head -1)

          if [ -z "$JS_FILE" ]; then

              post_fail \
                  "BUILD" \
                  "BUILD_ARTIFACT" \
                  0 \
                  "No JavaScript files found in Apollo build output."

              post_terminate_build

          fi


          ###########################################################################
          # Non-empty output
          ###########################################################################

          if [ -z "$(find "${BUILD_DIRECTORY}" -type f -size +0c -print -quit)" ]; then

              post_fail \
                  "BUILD" \
                  "BUILD_ARTIFACT" \
                  0 \
                  "Apollo build output is empty."

              post_terminate_build

          fi


          ###########################################################################
          # Gather Information
          ###########################################################################

          FILE_COUNT=$(find "${BUILD_DIRECTORY}" -type f | wc -l)

          TOTAL_SIZE=$(du -sh "${BUILD_DIRECTORY}" | cut -f1)


          post_pass \
              "BUILD" \
              "BUILD_ARTIFACT" \
              20 \
              "Apollo TypeScript build artifact successfully validated." \
              "BUILD_ARTIFACT: ${FILE_COUNT} files (${TOTAL_SIZE})."


      ###############################################################################
      # Upload Apollo Build Artifact
      ###############################################################################

      - name: Upload Build Artifact

        uses: actions/upload-artifact@v4

        with:

          name: packaged-application

          path: .

          retention-days: 1


      ###############################################################################
      # Terminate Verification
      ###############################################################################

      - name: Terminate Verification

        shell: bash

        run: |

          source .github/actions/common/report.sh

          post_terminate_build false