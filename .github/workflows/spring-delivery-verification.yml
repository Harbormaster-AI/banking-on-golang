name: Spring Boot Delivery Verification

on:

  workflow_call:

    inputs:

      runner:
        description: GitHub runner label
        required: false
        default: self-hosted
        type: string

      resultUrl:
        description: URL to post verification results
        required: false
        default: "http://localhost:3000"
        type: string

      actionToCall:
        description: action to call when posting to URL
        required: false
        default: "updateVerificationProgress"
        type: string

      branch:
        description: Branch to checkout
        required: false
        default: ""
        type: string

      gitHubToken:
        description: Token to securely access APIs and other capabilities on behalf of the caller
        required: true
        default: ""
        type: string

      certificationIdentifier:
        required: true
        type: string

      appName:
        required: true
        type: string

      dockerHost:
        description: Docker registry host
        required: false
        default: ""
        type: string

      dockerOrg:
        description: Docker organization
        required: false
        default: ""
        type: string

      dockerRepository:
        description: Docker repository
        required: false
        default: ""
        type: string

      dockerUsername:
        description: Docker username
        required: false
        default: ""
        type: string

      dockerPassword:
        description: Docker password
        required: false
        default: ""
        type: string

      dockerTag:
        description: Docker image tag
        required: false
        default: latest
        type: string

env:
  RESULT_URL:                   ${{ inputs.resultUrl }}
  ACTION_TO_CALL:               ${{ inputs.actionToCall }}
  CERTIFICATION_IDENTIFIER:     ${{ inputs.certificationIdentifier }}
  APP_NAME:                     ${{ inputs.appName }}
  HM_EXIT_WORKFLOW:             "false"
  REGISTRY_HOST:                ${{ inputs.dockerHost }}
  REGISTRY_ORG:                 ${{ inputs.dockerOrg }}
  REGISTRY_REPOSITORY:          ${{ inputs.dockerRepository }}
  REGISTRY_USERNAME:            ${{ inputs.dockerUsername }}
  REGISTRY_PASSWORD:            ${{ inputs.dockerPassword }}
  REGISTRY_TAG:                 ${{ inputs.dockerTag }}

jobs:

  delivery-verification:

    runs-on: ${{ inputs.runner }}

    services:

      mysql:

        image: mysql:8.4

        env:

          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: harbormaster

        ports:

          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      ###########################################################################
      #   Checkout source
      ###########################################################################

      - name: Checkout Source
        uses: actions/checkout@v4

        with:
          ref: ${{ inputs.branch }}

      ###########################################################################
      #   Announce start of delivery verification
      ###########################################################################

      - name: Delivery Verification Starting

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
          post_pass \
                        "DELIVERY" \
                        "STARTING_DELIVERY" \
                        0 \
                        "Delivery verification starting..." \
                        "" 

      ###########################################################################
      #   Download pre-built artifact
      ###########################################################################

      - uses: actions/download-artifact@v4
        with:
          name: packaged-application


      ###############################################################################
      # Verify Dockerfile
      ###############################################################################

      - name: Verify Dockerfile

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
          if [ -f Dockerfile ]; then
          
              post_pass \
                  "DELIVERY" \
                  "VERIFY_DOCKERFILE" \
                  5 \
                  "Dockerfile located." \
                  "VERIFY_DOCKERFILE: Dockerfile exists."
          
          else
          
              post_fail \
                  "DELIVERY" \
                  "VERIFY_DOCKERFILE" \
                  0 \
                  "Dockerfile not found." \
                  "VERIFY_DOCKERFILE: Unable to locate Dockerfile."
          
              post_terminate_delivery
          
          fi

      ###############################################################################
      # Setting up Docker
      ###############################################################################

      - name: Setting up Docker

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
            post_pass \
                "DELIVERY" \
                "SETTING_UP_DOCKER" \
                0 \
                "Setting up Docker..." \
                ""

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      ###############################################################################
      # Docker login
      ###############################################################################
      - name: Logging into Docker

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
            post_pass \
                "DELIVERY" \
                "DOCKER_LOGIN" \
                0 \
                "Logging into Docker..." \
                ""

      - name: Log in to Docker Hub
        id: docker_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username:  ${{ inputs.dockerUsername }}
          password:  ${{ inputs.dockerPassword }}

      ###############################################################################
      # Report Docker login
      ###############################################################################

      - name: Report Docker Login

        shell: bash

        run: |

          source .github/actions/common/report.sh

          if [ "${{ steps.docker_login.outcome }}" = "success" ]; then

              post_pass \
                  "DELIVERY" \
                  "DOCKER_LOGIN" \
                  10 \
                  "Successfully authenticated with Docker registry." \
                  ""

          else

              post_fail \
                  "DELIVERY" \
                  "DOCKER_LOGIN" \
                  0 \
                  "Unable to authenticate with Docker registry." \
                  "Verify the registry URL, username and password."

              post_terminate_delivery

          fi

      ###############################################################################
      # Docker Build
      ###############################################################################

      - name: Build Docker Image

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
                             
          echo "Running docker build..."
                    
          docker build --progress=plain -t "${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}" .
                    
          if [ $? -eq 0 ]; then
          
              post_pass \
                  "DELIVERY" \
                  "DOCKER_BUILD" \
                  20 \
                  "Docker image built successfully." \
                  "DOCKER_BUILD: ${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"
          
          else
          
              MESSAGE=$(tail -20 docker-build.log | tr '\n' ' ')
          
              post_fail \
                  "DELIVERY" \
                  "DOCKER_BUILD" \
                  0 \
                  "Docker build failed." \
                  "${MESSAGE}"
          
              post_terminate_delivery
          
          fi


      ###############################################################################
      # Verify Docker Image
      ###############################################################################

      - name: Verify Docker Image

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
          IMAGE=$(docker images -q "${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}")
          
          if [ -n "$IMAGE" ]; then
          
              post_pass \
                  "DELIVERY" \
                  "VERIFY_IMAGE" \
                  15 \
                  "Docker image verified." \
                  "VERIFY_IMAGE: ${IMAGE}"
          
          else
          
              post_fail \
                  "DELIVERY" \
                  "VERIFY_IMAGE" \
                  0 \
                  "Docker image missing." \
                  "VERIFY_IMAGE: Image not found."
          
              post_terminate_delivery
          
          fi

      ###############################################################################
      # Wait for MySQL (required by Spring Boot app in container)
      ###############################################################################

      - name: Wait For MySQL

        shell: bash

        run: |
          source .github/actions/common/report.sh

          post_pass \
              "DELIVERY" \
              "WAITING_FOR_MYSQL" \
              0 \
              "Waiting for MySQL to start." \
              ""

          for i in {1..60}; do
              if bash -c "</dev/tcp/127.0.0.1/3306" >/dev/null 2>&1; then
                  post_pass \
                      "DELIVERY" \
                      "MYSQL_READY" \
                      0 \
                      "MySQL is ready." \
                      "MySQL service is accepting connections."
                  exit 0
              fi
              sleep 2
          done

          post_fail \
              "DELIVERY" \
              "MYSQL_READY" \
              0 \
              "MySQL failed to start." \
              "MySQL service did not become ready within 120 seconds."

          post_terminate_delivery

      ###############################################################################
      # Run Container
      ###############################################################################

      - name: Run Docker Container

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
          # Container must reach GitHub Actions MySQL service on the host.
          # Pass DB settings the same way runtime does (workflow owns credentials).
          docker run -d --name ${APP_NAME} -p 8080:8080 \
            --add-host=host.docker.internal:host-gateway \
            -e SERVER_PORT=8080 \
            -e SPRING_DATASOURCE_URL='jdbc:mysql://host.docker.internal:3306/harbormaster' \
            -e SPRING_DATASOURCE_USERNAME=root \
            -e SPRING_DATASOURCE_PASSWORD=root \
            -e SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver \
            -e SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect \
            ${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}
          
          if [ $? -eq 0 ]; then
          
              post_pass \
                  "DELIVERY" \
                  "RUN_CONTAINER" \
                  20 \
                  "Container ${APP_NAME} started." \
                  "RUN_CONTAINER: ${APP_NAME}"
          
          else
          
              post_fail \
                  "DELIVERY" \
                  "RUN_CONTAINER" \
                  0 \
                  "Unable to start container ${APP_NAME}." \
                  "RUN_CONTAINER: docker run failed on ${APP_NAME}."
          
              post_terminate_delivery
          
          fi

      ###############################################################################
      # Verify Container
      ###############################################################################

      - name: Verify Container Health

        shell: bash

        run: |
          
          source .github/actions/common/report.sh
          
          for i in {1..90}; do
          
              if curl -fs http://localhost:8080/actuator/health >/dev/null; then
          
                  post_pass \
                      "DELIVERY" \
                      "CONTAINER_HEALTH" \
                      15 \
                      "Container health check passed." \
                      "CONTAINER_HEALTH: Application reported UP."
          
                  exit 0
          
              fi
          
              sleep 2
          
          done
          
          LOG=$(docker logs ${APP_NAME} | tail -20 | tr '\n' ' ')
          
          post_fail \
              "DELIVERY" \
              "CONTAINER_HEALTH" \
              0 \
              "Container failed health check." \
              "${LOG}"
          
          post_terminate_delivery


      ###########################################################################
      # Push Image
      ###########################################################################

      - name: Push Image

        shell: bash

        run: |
          
          source .github/actions/common/report.sh

          if docker push ${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}; then
          
            post_pass \
              "DELIVERY" \
              "PUBLISH_IMAGE" \
              15 \
              "Docker image published successfully." \
              "PUBLISH_IMAGE: ${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"
    
          else
            
            post_fail \
              "DELIVERY" \
              "PUBLISH_IMAGE" \
              0 \
              "Docker image publication failed." \
              "PUBLISH_IMAGE: Unable to push ${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"
        
              post_terminate_delivery
      
            fi


      ###########################################################################
      #   Store the image as an artifact
      ###########################################################################

      - name: Store Docker Image

        run: |
        
          if [ "${{ inputs.saveDockerImage }}" = "TRUE" ]; then
            docker save ${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}:latest -o ${APP_NAME}.tar
          fi

      - uses: actions/upload-artifact@v4

        with:

          name: docker-image

          path: ${{ env.APP_NAME }}.tar

      ###############################################################################
      # Cleanup
      ###############################################################################

      - name: Cleanup

        if: always()

        shell: bash

        run: |
          
          source .github/actions/common/report.sh

          ###########################################################################
          # stop the image
          ###########################################################################
          
          docker stop ${APP_NAME} >/dev/null 2>&1 || true
          
          ###########################################################################
          # remove the image
          ###########################################################################
          
          docker rm ${APP_NAME} >/dev/null 2>&1 || true

          ###########################################################################
          # Logout
          ###########################################################################

          docker logout ${{ inputs.dockerHost }}
          
          post_pass \
              "DELIVERY" \
              "CLEANUP" \
              0 \
              "Container stopped and removed locally." \
              "CLEANUP: Docker resources cleaned up."


      ###############################################################################
      # Terminate Verification
      ###############################################################################

      - name: Delete Verification Branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ inputs.gitHubToken  }}" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${{ inputs.branch  }}

      ###############################################################################
      # Terminate Verification
      ###############################################################################

      - name: Terminate Verification
        shell: bash

        run: |
          source .github/actions/common/report.sh
          
          post_terminate_delivery false