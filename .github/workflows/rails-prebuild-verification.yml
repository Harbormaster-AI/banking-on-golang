name: Rails Pre-Build Verification

on:
  workflow_call:

    inputs:

      runner:
        description: GitHub runner
        required: false
        default: self-hosted
        type: string

      resultUrl:
        description: URL to post certification progress
        required: false
        default: "http://localhost:3000"
        type: string

      actionToCall:
        description: action to call when posting to URL
        required: true
        default: "updateSystemVerificationProgress"
        type: string

      branch:
        description: Branch to checkout
        required: true
        default: ""
        type: string

      certificationIdentifier:
        description: Certification Identifier
        required: true
        type: string

      appName:
        description: Application Name
        required: true
        type: string

      languageName:
        description: The core language of the system
        required: false
        default: "Ruby"
        type: string

      languageVersion:
        description: Ruby version
        required: true
        type: string


env:
  RESULT_URL: ${{ inputs.resultUrl }}
  ACTION_TO_CALL: ${{ inputs.actionToCall }}
  CERTIFICATION_IDENTIFIER: ${{ inputs.certificationIdentifier }}
  APP_NAME: ${{ inputs.appName }}
  HM_EXIT_WORKFLOW: "false"


# Required for COMMIT_FORMATTED_SOURCE.
permissions:
  contents: write


jobs:

  pre-build-verification:

    runs-on: ${{ inputs.runner }}

    steps:

      ###########################################################################
      # Checkout Source
      ###########################################################################

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true


      ###########################################################################
      # Always use report.sh from the verification workflow commit
      ###########################################################################

      - name: Overlay verification report.sh
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .hm-verification-overlay
          sparse-checkout: |
            .github/actions/common
          sparse-checkout-cone-mode: false


      - name: Install verification report.sh
        shell: bash
        run: |
          mkdir -p .github/actions/common

          cp -f \
            .hm-verification-overlay/.github/actions/common/report.sh \
            .github/actions/common/report.sh

          chmod +x .github/actions/common/report.sh


      ###########################################################################
      # Verify Checkout
      ###########################################################################

      - name: Verify Checkout
        shell: bash
        run: |

          source .github/actions/common/report.sh

          if [ -d ".git" ]; then

            post_pass \
              "PRE_BUILD" \
              "CHECKOUT_SOURCE" \
              0 \
              "Repository checked out successfully."

          else

            post_fail \
              "PRE_BUILD" \
              "CHECKOUT_SOURCE" \
              0 \
              "Repository checkout failed."

            post_terminate_prebuild

          fi


      ###########################################################################
      # Determine Rails Application Directory
      ###########################################################################

      - name: Determine Rails Application Directory
        shell: bash
        run: |

          source .github/actions/common/report.sh

          if [ -d "${APP_NAME}" ] && {
              find "${APP_NAME}" -maxdepth 2 \
                \( -name "Gemfile" -o -name "config.ru" \) \
                -print -quit | grep -q .;
          }; then

            APP_DIR="${APP_NAME}"

          elif find . -maxdepth 2 \
              \( -name "Gemfile" -o -name "config.ru" \) \
              -print -quit | grep -q .; then

            APP_DIR="."

          else

            post_fail \
              "PRE_BUILD" \
              "RAILS_APPLICATION" \
              0 \
              "Could not locate Rails application sources." \
              "Expected ./${APP_NAME} or a Gemfile/config.ru in the repository."

            post_terminate_prebuild

          fi

          echo "APP_DIR=${APP_DIR}" >> "$GITHUB_ENV"

          echo "Resolved APP_DIR=${APP_DIR}"


      ###########################################################################
      # Determine Ruby Version
      ###########################################################################

      - name: Determine Ruby Version
        shell: bash
        run: |

          source .github/actions/common/report.sh

          RUBY_VERSION="${{ inputs.languageVersion }}"

          if [ -z "${RUBY_VERSION}" ]; then

            if [ -f "${APP_DIR}/.ruby-version" ]; then
              RUBY_VERSION="$(cat "${APP_DIR}/.ruby-version" | tr -d '[:space:]')"
            else
              RUBY_VERSION="3.4"
            fi

          fi

          echo "RUBY_VERSION=${RUBY_VERSION}" >> "$GITHUB_ENV"

          echo "Application: ${APP_NAME}"
          echo "Ruby version: ${RUBY_VERSION}"
          echo "Language: ${LANGUAGE_NAME}"


      ###########################################################################
      # Setup Ruby
      ###########################################################################

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false


      ###########################################################################
      # Verify Ruby
      ###########################################################################

      - name: Verify Ruby
        shell: bash
        run: |

          source .github/actions/common/report.sh

          echo "Installed Ruby:"
          ruby --version

          echo ""
          echo "Ruby information:"
          ruby -v

          echo ""
          echo "Bundler:"
          bundle --version


      ###########################################################################
      # Verify Files
      ###########################################################################

      - name: Verify Files
        shell: bash
        run: |

          source .github/actions/common/report.sh

          cd "${APP_DIR}"

          MISSING_FILES=""

          if [ ! -f "Gemfile" ]; then
            MISSING_FILES="${MISSING_FILES} Gemfile"
          fi

          if [ ! -f "config/application.rb" ]; then
            MISSING_FILES="${MISSING_FILES} config/application.rb"
          fi

          if [ ! -f "config/environment.rb" ]; then
            MISSING_FILES="${MISSING_FILES} config/environment.rb"
          fi

          if [ -n "${MISSING_FILES}" ]; then

            post_fail \
              "PRE_BUILD" \
              "VERIFY_FILES" \
              0 \
              "Required Rails files were not found." \
              "Missing:${MISSING_FILES}"

            post_terminate_prebuild

          fi

          post_pass \
            "PRE_BUILD" \
            "VERIFY_FILES" \
            5 \
            "Rails application files verified." \
            "Gemfile, Gemfile.lock, and Rails configuration files were found."


      ###########################################################################
      # Verify Directories
      ###########################################################################

      - name: Verify Directories
        shell: bash
        run: |

          source .github/actions/common/report.sh

          cd "${APP_DIR}"

          REQUIRED_DIRECTORIES="app config"

          for DIRECTORY in ${REQUIRED_DIRECTORIES}; do

            if [ ! -d "${DIRECTORY}" ]; then

              post_fail \
                "PRE_BUILD" \
                "VERIFY_DIRECTORIES" \
                0 \
                "Required Rails directory was not found." \
                "Missing directory: ${DIRECTORY}"

              post_terminate_prebuild

            fi

          done

          post_pass \
            "PRE_BUILD" \
            "VERIFY_DIRECTORIES" \
            5 \
            "Rails directory structure verified."

      ###########################################################################
      # Setup RuboCopy Gem
      ###########################################################################

      - name: Setup RuboCop
        shell: bash
        run: |
          gem install rubocop -v 1.81.6 --no-document

      ###########################################################################
      # Format Code
      ###########################################################################

      - name: Format Code
        shell: bash
        run: |

          source .github/actions/common/report.sh

          cd "${APP_DIR}"

          echo "Running RuboCop formatter..."
      
          rubocop -A > /dev/null 2>&1 || {
            RC=$?
          
            if [ "$RC" -ne 1 ]; then
              echo "RuboCop formatter failed with exit code ${RC}."
              exit "$RC"
            fi
          }
          
          echo "Checking for remaining RuboCop offenses..."
          
          if ! rubocop --format simple 2>&1 | tee rubocop-analysis.log; then
            MESSAGE=$(tail -30 rubocop-analysis.log | tr '\n' ' ')
            post_fail "Static Analysis" "RuboCop found remaining offenses: ${MESSAGE}"
            post_terminate_build
          fi
          
          post_pass \
            "PRE_BUILD" \
            "FORMAT_CODE" \
            15 \
            "Rails source formatting completed successfully." \
            "RuboCop completed with no remaining violations."


      ###########################################################################
      # Commit Formatted Source
      ###########################################################################

      - name: Commit Formatted Source
        shell: bash
        run: |

          source .github/actions/common/report.sh

          echo "Checking for formatted source changes..."

          git status --short

          #######################################################################
          # Since new new files are generated up to this point, stage all the files
          #######################################################################

          git add -- .

          echo "Files staged for commit:"

          git diff --cached --name-status

          if git diff --cached --quiet; then

            post_pass \
              "PRE_BUILD" \
              "COMMIT_FORMATTED_SOURCE" \
              0 \
              "No formatted source changes require committing." \
              "No Ruby source changes were produced by formatting."

            exit 0

          fi

          #######################################################################
          # Configure commit identity
          #######################################################################

          git config user.name "HarborMaster Verification"
          git config user.email "dev@harbormaster.net"

          #######################################################################
          # Determine target branch
          #######################################################################

          TARGET_BRANCH="${{ inputs.branch }}"

          if [ -z "${TARGET_BRANCH}" ]; then
            TARGET_BRANCH="${GITHUB_REF_NAME}"
          fi

          echo "Target branch: ${TARGET_BRANCH}"

          #######################################################################
          # Ensure the local branch corresponds to the source branch.
          #######################################################################

          git fetch origin "${TARGET_BRANCH}"

          git checkout -B "${TARGET_BRANCH}" \
            "origin/${TARGET_BRANCH}"

          #######################################################################
          # Re-stage all files after checkout.
          #######################################################################

          git add -- .
          
          echo "Final staged files:"

          git diff --cached --name-status

          #######################################################################
          # Commit
          #######################################################################

          if ! git commit -m "chore: format generated Rails source"; then

            post_fail \
              "PRE_BUILD" \
              "COMMIT_FORMATTED_SOURCE" \
              0 \
              "Failed to commit formatted Rails source."

            post_terminate_prebuild

          fi

          COMMIT_SHA=$(git rev-parse HEAD)

          echo "Created commit: ${COMMIT_SHA}"

          #######################################################################
          # Push explicitly to the source branch.
          #######################################################################

          if git push origin \
              "HEAD:${TARGET_BRANCH}"; then

            post_pass \
              "PRE_BUILD" \
              "COMMIT_FORMATTED_SOURCE" \
              5 \
              "Formatted Rails source committed successfully." \
              "Commit ${COMMIT_SHA} pushed to ${TARGET_BRANCH}."

          else

            post_fail \
              "PRE_BUILD" \
              "COMMIT_FORMATTED_SOURCE" \
              0 \
              "Failed to push formatted Rails source." \
              "GitHub rejected the push to ${TARGET_BRANCH}."

            post_terminate_prebuild

          fi

      ###############################################################################
      # Package and Upload formatted source
      ###############################################################################

      - name: Package Formatted Source
        shell: bash
        run: |
          set -e
          
          echo "Packaging formatted source..."
          
          tar \
            --exclude='.git' \
            -czf /tmp/formatted-source.tar.gz \
            .
          
          echo "Formatted source packaged:"
          ls -lh /tmp/formatted-source.tar.gz

      - name: Upload Formatted Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: /tmp/formatted-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      ###########################################################################
      # Static Analysis
      ###########################################################################

      - name: Static Analysis
        shell: bash
        run: |

          source .github/actions/common/report.sh

          cd "${APP_DIR}"

          echo "Checking for remaining RuboCop offenses..."
        
          if ! rubocop --format simple 2>&1 | tee rubocop-analysis.log; then
            post_fail \
              "Static Analysis" \
              "RuboCop found remaining offenses. See the RuboCop output above."
              post_terminate_build
          else
            post_pass \
              "PRE_BUILD" \
              "STATIC_ANALYSIS" \
              25 \
              "Rails static analysis completed successfully." \
              "RuboCop completed with no remaining violations."
          fi


      ###########################################################################
      # Setup Trivy
      ###########################################################################

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.74.0
          cache: true


      ###########################################################################
      # Security Check
      ###########################################################################

      - name: Security Check
        shell: bash
        run: |

          source .github/actions/common/report.sh

          cd "${APP_DIR}"

          echo "Resolving Rails dependencies for security scanning..."
  
          bundle install

          echo "Running Trivy vulnerability scan..."
          
          if ! trivy fs . \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 1 \
            2>&1 | tee trivy-security.log; then
            
            MESSAGE=$(tail -30 trivy-security.log | tr '\n' ' ')
            
            post_fail \
              "Security Check" \
              "Trivy vulnerability scan failed: ${MESSAGE}"
            
            post_terminate_build

          else
            post_pass \
              "PRE_BUILD" \
              "SECURITY_CHECK" \
              40 \
              "Rails security check completed successfully." \
              "Trivy found no HIGH or CRITICAL vulnerabilities."
          fi

      ###########################################################################
      # Terminate Verification
      ###########################################################################

      - name: Terminate Verification
        shell: bash
        run: |

          source .github/actions/common/report.sh

          post_terminate_prebuild false