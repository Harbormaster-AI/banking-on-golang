name: Ruby on Rails Deployment Verification

on:

  workflow_call:

    inputs:

      runner:
        description: GitHub runner label
        required: false
        default: self-hosted
        type: string

      resultUrl:
        description: URL to post verification results
        required: false
        default: "http://localhost:3000"
        type: string

      actionToCall:
        description: action to call when posting to URL
        required: false
        default: "updateSystemVerificationProgress"
        type: string

      branch:
        description: Branch to checkout
        required: false
        default: ""
        type: string

      gitHubToken:
        description: Token to securely access APIs and other capabilities on behalf of the caller
        required: true
        default: ""
        type: string

      certificationIdentifier:
        required: true
        type: string

      appName:
        required: true
        type: string

      dockerHost:
        description: Docker registry host
        required: false
        default: ""
        type: string

      dockerOrg:
        description: Docker organization
        required: false
        default: ""
        type: string

      dockerRepository:
        description: Docker repository
        required: false
        default: ""
        type: string

      dockerUsername:
        description: Docker username
        required: false
        default: ""
        type: string

      dockerPassword:
        description: Docker password
        required: false
        default: ""
        type: string

      dockerTag:
        description: Docker image tag
        required: false
        default: latest
        type: string

      saveDockerImage:
        description: Save Docker image as artifact
        required: false
        default: "FALSE"
        type: string


env:

  RESULT_URL:                   ${{ inputs.resultUrl }}
  ACTION_TO_CALL:               ${{ inputs.actionToCall }}
  CERTIFICATION_IDENTIFIER:     ${{ inputs.certificationIdentifier }}
  APP_NAME:                     ${{ inputs.appName }}

  REGISTRY_HOST:                ${{ inputs.dockerHost }}
  REGISTRY_ORG:                 ${{ inputs.dockerOrg }}
  REGISTRY_REPOSITORY:          ${{ inputs.dockerRepository }}
  REGISTRY_USERNAME:            ${{ inputs.dockerUsername }}
  REGISTRY_PASSWORD:            ${{ inputs.dockerPassword }}
  REGISTRY_TAG:                 ${{ inputs.dockerTag }}


jobs:

  deployment-verification:

    runs-on: ${{ inputs.runner }}

    steps:

      ###########################################################################
      # Checkout Verification Scripts
      #
      # IMPORTANT:
      # Do NOT checkout the Rails application source.
      #
      # Only the common reporting infrastructure is required from the
      # repository. The application itself comes from packaged-application.
      ###########################################################################

      - name: Checkout Verification Scripts

        uses: actions/checkout@v4

        with:
          ref: ${{ inputs.branch }}
          sparse-checkout: |
            .github/actions/common
          sparse-checkout-cone-mode: true


      ###########################################################################
      # Download pre-built Rails artifact
      #
      # IMPORTANT:
      # Do NOT run bundle install or rebuild the application here.
      #
      # Build Verification has already built and validated the application
      # and uploaded RAILS_APP_DIRECTORY as packaged-application.
      #
      # The artifact contents are downloaded directly into the workspace root.
      ###########################################################################

      - name: Download Build Artifact

        uses: actions/download-artifact@v4

        with:
          name: packaged-application

      ###########################################################################
      # Announce start of deployment verification
      ###########################################################################

      - name: Deployment Verification Starting

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          post_pass \
            "DEPLOYMENT" \
            "STARTING_DEPLOYMENT" \
            0 \
            "Ruby on Rails deployment verification starting..." \
            ""

      ###########################################################################
      # Verify Bundled Gems
      ###########################################################################

      - name: Verify Bundled Gems
        shell: bash
        run: |
          echo "=== BUNDLER CONFIG ==="
          cat .bundle/config
          
          echo "=== PUMA GEM ==="
          find vendor/bundle -type d -name "puma-*" -print
          
          echo "=== PUMA SPECIFICATION ==="
          find vendor/bundle -type f -name "puma-*.gemspec" -print
          
      ###########################################################################
      # Show downloaded artifact
      ###########################################################################

      - name: Show Build Artifact

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          echo "Rails deployment artifact:"
          find . -maxdepth 5 -type f | sort


      ###########################################################################
      # Verify Dockerfile
      ###########################################################################

      - name: Verify Dockerfile

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          if [ -f "Dockerfile" ]; then

            post_pass \
              "DEPLOYMENT" \
              "VERIFY_DOCKERFILE" \
              5 \
              "Dockerfile located." \
              "VERIFY_DOCKERFILE: Dockerfile exists."

          else

            post_fail \
              "DEPLOYMENT" \
              "VERIFY_DOCKERFILE" \
              0 \
              "Dockerfile not found." \
              "VERIFY_DOCKERFILE: Unable to locate Dockerfile."

            post_terminate_delivery

          fi


      ###########################################################################
      # Set up Docker
      ###########################################################################

      - name: Setting up Docker

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          post_pass \
            "DEPLOYMENT" \
            "SETTING_UP_DOCKER" \
            0 \
            "Setting up Docker..." \
            ""


      - name: Set up Docker Buildx

        uses: docker/setup-buildx-action@v3


      ###########################################################################
      # Docker Login
      ###########################################################################

      - name: Logging into Docker

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          post_pass \
            "DEPLOYMENT" \
            "DOCKER_LOGIN" \
            0 \
            "Logging into Docker..." \
            ""


      - name: Log in to Docker Hub

        id: docker_login

        continue-on-error: true

        uses: docker/login-action@v3

        with:

          username: ${{ inputs.dockerUsername }}
          password: ${{ inputs.dockerPassword }}


      ###########################################################################
      # Report Docker Login
      ###########################################################################

      - name: Report Docker Login

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          if [ "${{ steps.docker_login.outcome }}" = "success" ]; then

            post_pass \
              "DEPLOYMENT" \
              "DOCKER_LOGIN" \
              10 \
              "Successfully authenticated with Docker registry." \
              ""

          else

            post_fail \
              "DEPLOYMENT" \
              "DOCKER_LOGIN" \
              0 \
              "Unable to authenticate with Docker registry." \
              "Verify the registry URL, username and password."

            post_terminate_delivery

          fi


      ###########################################################################
      # Build Rails Docker Image
      #
      # Build context is the downloaded packaged application.
      ###########################################################################

      - name: Build Docker Image

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          echo "Running Ruby on Rails docker build..."
          echo "Build context: ${GITHUB_WORKSPACE}"

          if docker build \
            --progress=plain \
            -t "${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}" \
            .; then

            post_pass \
              "DEPLOYMENT" \
              "DOCKER_BUILD" \
              20 \
              "Ruby on Rails Docker image built successfully." \
              "DOCKER_BUILD: ${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"

          else

            post_fail \
              "DEPLOYMENT" \
              "DOCKER_BUILD" \
              0 \
              "Ruby on Rails Docker build failed." \
              "DOCKER_BUILD: Docker build failed."

            post_terminate_delivery

          fi


      ###########################################################################
      # Verify Docker Image
      ###########################################################################

      - name: Verify Docker Image

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          IMAGE=$(docker images -q \
            "${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}")

          if [ -n "$IMAGE" ]; then

            post_pass \
              "DEPLOYMENT" \
              "VERIFY_IMAGE" \
              15 \
              "Docker image verified." \
              "VERIFY_IMAGE: ${IMAGE}"

          else

            post_fail \
              "DEPLOYMENT" \
              "VERIFY_IMAGE" \
              0 \
              "Docker image missing." \
              "VERIFY_IMAGE: Image not found."

            post_terminate_delivery

          fi

      ###########################################################################
      # Start Postgres as docker container on the same network as the
      # target application (image)...wait until the container is ready to accept
      # requests before moving on
      ###########################################################################
      - name: Start PostgreSQL
        shell: bash
        run: |
          docker network create harbormaster-verification 2>/dev/null || true
          
          docker run -d \
            --name harbormaster-postgres \
            --network harbormaster-verification \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=rails_test \
            postgres:17-alpine
          
          echo "Waiting for PostgreSQL to become ready..."
          
          for i in {1..30}; do
            if docker exec harbormaster-postgres \
              pg_isready \
                -U postgres \
                -d rails_test \
                >/dev/null 2>&1; then
          
              echo "PostgreSQL is ready."
              exit 0
            fi
          
            sleep 2
          done
          
          echo "PostgreSQL failed to become ready."
          docker logs harbormaster-postgres
          exit 1

      ###########################################################################
      # Run Rails Docker Container
      #
      # Rails applications listen on port 3000 by default.
      # Port 8080 is used on the GitHub runner.
      #
      # This is a Docker delivery verification only. No PostgreSQL container
      # is started and no external database is configured here.
      ###########################################################################

      - name: Run Docker Container

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          docker run -d \
            --name ${APP_NAME} \
            --network harbormaster-verification \
            -e RAILS_ENV=harbormaster_test \
            -e PGHOST=harbormaster-postgres \
            -e PGPORT=5432 \
            -e PGUSER=postgres \
            -e PGPASSWORD=postgres \
            -e PGDATABASE=rails_test \
            -e SECRET_KEY_BASE="$(ruby -rsecurerandom -e 'puts SecureRandom.hex(64)')" \
            -p 8080:3000 \
            "${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"

          if [ $? -eq 0 ]; then

            post_pass \
              "DEPLOYMENT" \
              "RUN_CONTAINER" \
              20 \
              "Ruby on Rails container ${APP_NAME} started." \
              "RUN_CONTAINER: ${APP_NAME}"

          else

            post_fail \
              "DEPLOYMENT" \
              "RUN_CONTAINER" \
              0 \
              "Unable to start Ruby on Rails container ${APP_NAME}." \
              "RUN_CONTAINER: docker run failed."

            post_terminate_delivery

          fi


      ###########################################################################
      # Verify Rails Container Health
      #
      # No PostgreSQL is started. The HTTP check verifies that the Docker
      # container is running and Rails is responding.
      ###########################################################################

      - name: Verify Container Health
        shell: bash
        run: |
          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"
          
          for i in {1..30}; do
          
            HTTP_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              http://localhost:8080/ \
              || true)
          
            echo "Health check ${i}/30: HTTP ${HTTP_STATUS}"
          
            if [ "$HTTP_STATUS" != "000" ]; then
              post_pass \
                "DEPLOYMENT" \
                "CONTAINER_HEALTH" \
                15 \
                "Ruby on Rails container health check passed." \
                "CONTAINER_HEALTH: http://localhost:8080/ responded with HTTP ${HTTP_STATUS}."
          
              exit 0
            fi
          
            sleep 2
          done
          
          LOG=$(docker logs "${APP_NAME}" 2>&1 | tail -30 | tr '\n' ' ')
          cat ${LOG}
          
          post_fail \
            "DEPLOYMENT" \
            "CONTAINER_HEALTH" \
            0 \
            "Ruby on Rails container failed health check." \
            "${LOG}"
          
          post_terminate_delivery


      ###########################################################################
      # Push Rails Docker Image
      ###########################################################################

      - name: Push Image

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          if docker push \
            "${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"; then

            post_pass \
              "DEPLOYMENT" \
              "PUBLISH_IMAGE" \
              15 \
              "Ruby on Rails Docker image published successfully." \
              "PUBLISH_IMAGE: ${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"

          else

            post_fail \
              "DEPLOYMENT" \
              "PUBLISH_IMAGE" \
              0 \
              "Ruby on Rails Docker image publication failed." \
              "PUBLISH_IMAGE: Unable to push ${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}"

            post_terminate_delivery

          fi


      ###########################################################################
      # Store Docker Image
      ###########################################################################

      - name: Store Docker Image

        shell: bash

        run: |

          if [ "${{ inputs.saveDockerImage }}" = "TRUE" ]; then

            docker save \
              "${{ inputs.dockerOrg }}/${{ inputs.dockerRepository }}:${{ inputs.dockerTag }}" \
              -o ${APP_NAME}.tar

          fi


      - name: Upload Docker Image

        if: ${{ inputs.saveDockerImage == 'TRUE' }}

        uses: actions/upload-artifact@v4

        with:

          name: docker-image
          path: ${APP_NAME}.tar


      ###########################################################################
      # Cleanup
      ###########################################################################

      - name: Cleanup

        if: always()

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          ###########################################################################
          # Stop the Rails container
          ###########################################################################

          docker stop ${APP_NAME} >/dev/null 2>&1 || true

          ###########################################################################
          # Remove the Rails container
          ###########################################################################

          docker rm ${APP_NAME} >/dev/null 2>&1 || true

          ###########################################################################
          # Logout
          ###########################################################################

          docker logout ${{ inputs.dockerHost }} >/dev/null 2>&1 || true

          post_pass \
            "DEPLOYMENT" \
            "CLEANUP" \
            0 \
            "Ruby on Rails container stopped and removed locally." \
            "CLEANUP: Docker resources cleaned up."


      ###########################################################################
      # Delete Verification Branch
      ###########################################################################

      - name: Delete Verification Branch

        if: always()

        env:

          GH_TOKEN: ${{ inputs.gitHubToken }}

        run: |

          curl -L \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ inputs.gitHubToken }}" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/heads/${{ inputs.branch }}


      ###########################################################################
      # Terminate Verification
      ###########################################################################

      - name: Terminate Verification

        if: always()

        shell: bash

        run: |

          source "${GITHUB_WORKSPACE}/.github/actions/common/report.sh"

          post_terminate_delivery false
